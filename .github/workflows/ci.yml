name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          QUEUE_BACKEND: inline
          STORAGE_BACKEND: local
        run: python -m pytest tests

      - name: Run labeled extraction evaluation
        run: python scripts/evaluate_dataset.py --labels samples/eval_labels.json --report-output docs/evaluation_report.md

      - name: Run RAG retrieval evaluation
        run: python scripts/evaluate_rag.py --labels samples/rag_eval_labels.json --report-output docs/rag_evaluation_report.md

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend in installed Chrome
        working-directory: frontend
        run: google-chrome --version && npm run test:e2e

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser-test dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Build and start the container stack
        run: docker compose up --build -d

      - name: Verify API and frontend
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8000/health
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:4173/

      - name: Verify browser-to-API delivery path in installed Chrome
        working-directory: frontend
        run: google-chrome --version && npm run test:e2e:docker

      - name: Stop the container stack
        if: always()
        run: docker compose down -v
